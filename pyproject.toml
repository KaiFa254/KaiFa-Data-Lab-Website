# =============================================================
# pyproject.toml  -  the project's identity card.
# Read by uv (environment and packages) and by tools like pytest.
# Lines starting with # are comments: ignored by the tools.
# =============================================================

[project]
# The project's name (lowercase, hyphens).
name = "kaifa-data-lab"
version = "0.1.0"
description = "KaiFa Data Lab: learn data, buy products, hire data services."
# Python 3.12 exactly, to match Truehost (ADR-007).
requires-python = ">=3.12,<3.13"
# Packages the app needs to RUN. Managed by `uv add` - don't edit by hand.
dependencies = [
    "fastapi>=0.142.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

# Settings for pytest (Lesson 2.4).
[tool.pytest.ini_options]
# Let tests import the `app` package from the project folder.
pythonpath = ["."]
# Where the tests live.
testpaths = ["tests"]
